name: Publish production site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-web-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://mrdalili.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify publication data and site tests
        run: |
          node scripts/generate-blog-runtime.mjs --check
          node scripts/generate-sitemap.mjs --check
          node scripts/check-blog-skills.mjs
          node scripts/test-site.mjs
          python3 -B -m unittest discover -s tests -p 'test_deploy_site.py'
          python3 -B scripts/deploy_site.py --dry-run
      - name: Skip a superseded commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit is queued; skipping this deployment."
          fi
      - name: Publish over verified FTPS and check public bytes
        if: steps.head.outputs.current == 'true'
        env:
          DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
          DEPLOY_FTPS_USER: ${{ secrets.DEPLOY_FTPS_USER }}
          DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
        run: python3 -B scripts/deploy_site.py
