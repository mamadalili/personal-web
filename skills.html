<!doctype html>
<html lang="fa" dir="rtl">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,follow">
 <title>CV — محمدرضا دلیلی</title>
 <link rel="icon" href="assets/brand/monogram.svg" type="image/svg+xml">
 <script>
 (()=>{
  const params=new URLSearchParams(location.search);
  let saved;try{saved=localStorage.getItem('portfolio-language');}catch{}
  const language=['fa','en'].includes(params.get('lang'))?params.get('lang'):saved==='en'?'en':'fa';
  const target=new URL('profile.html',location.href);
  target.searchParams.set('lang',language);target.searchParams.set('tab','experience');
  location.replace(target.href);
 })();
 </script>
</head>
<body><a href="profile.html">CV — مسیر کاری من / My work experience</a></body>
</html>
